<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N.Flying 行程日历</title>
<style>
:root{color-scheme:dark;--bg:#10131a;--panel:#191e29;--line:#2b3342;--muted:#a6afbf;--text:#f4f6fb;--accent:#c6a7ff;--green:#8bd5b0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#25233b 0,#10131a 52%);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:980px;margin:0 auto;padding:36px 20px 64px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap}.eyebrow{color:var(--accent);letter-spacing:.16em;font-size:11px;font-weight:700}.title{font-size:34px;letter-spacing:.02em;margin:4px 0}.sub,.muted{color:var(--muted)}.meta{font-size:12px;color:var(--muted);text-align:right}.panel{background:#191e29d9;border:1px solid var(--line);border-radius:18px;padding:18px;margin:22px 0}.stats{display:flex;gap:18px;flex-wrap:wrap}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--muted)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.controls button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:8px 14px;cursor:pointer}.controls button.active{background:var(--accent);color:#171321;border-color:var(--accent)}.event{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}.date{font-weight:700;color:var(--accent)}.date small{display:block;color:var(--muted);font-weight:400}.event h3{margin:0 0 5px;font-size:16px}.details{color:var(--muted);font-size:13px}.tag{display:inline-block;font-size:11px;padding:2px 8px;border:1px solid #51466b;border-radius:999px;color:#d9c8ff;margin:0 6px 5px 0}.links a{color:var(--green);font-size:12px;margin-right:10px}.empty{color:var(--muted);padding:26px 0}.footer{font-size:12px;color:var(--muted);margin-top:32px}@media(max-width:560px){main{padding:24px 14px}.title{font-size:28px}.event{grid-template-columns:72px 1fr;gap:10px}.meta{text-align:left}}
</style></head><body><main>
<header class="top"><div><div class="eyebrow">N.FLYING · SCHEDULE TRACKER</div><h1 class="title">N.Flying 行程日历</h1><div class="sub">官方公告与经过交叉核验的公开行程</div></div><div class="meta" id="updated">正在读取数据…</div></header>
<section class="panel"><div class="stats"><div class="stat"><b id="total">—</b><span>未来行程</span></div><div class="stat"><b id="changes">—</b><span>本轮新增 / 变更</span></div><div class="stat"><b id="pending">—</b><span>待核验线索</span></div></div></section>
<nav class="controls" id="filters"><button class="active" data-filter="all">全部</button><button data-filter="concert">演出 / 音乐节</button><button data-filter="fan">粉丝活动</button><button data-filter="other">其他</button></nav>
<section id="events"></section><section class="panel"><strong>本轮更新</strong><div id="changeList" class="details" style="margin-top:8px">暂无变更记录</div></section>
<div class="footer">行程以来源原文为准；时间同时标注当地时间及北京时间（如可换算）。若官方来源暂时无法读取，不代表活动取消。</div>
</main><script>
let allEvents=[],filter="all";const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function category(e){const c=(e.cat||"").toLowerCase();if(/concert|live|festival|showcase/.test(c))return"concert";if(/fan|sign|video/.test(c))return"fan";return"other";}
function render(){const today=new Date().toISOString().slice(0,10);const events=allEvents.filter(e=>(e.date||"")>=today&&(filter==="all"||category(e)===filter)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$("total").textContent=allEvents.filter(e=>(e.date||"")>=today).length;$("events").innerHTML=events.length?events.map(e=>{const src=(e.sources||[]).map(s=>'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label||"来源")+'</a>').join("");const time=[e.time?(e.time+" "+(e.tz||"")):"",e.bj?("北京时间 "+e.bj):""].filter(Boolean).join(" · ");return '<article class="event"><div class="date">'+esc(e.date)+'<small>'+esc(time)+'</small></div><div><span class="tag">'+esc(e.status||"待确认")+'</span><h3>'+esc(e.title)+'</h3><div class="details">'+esc(e.venue||e.city||"")+(e.note?" · "+esc(e.note):"")+'</div><div class="links">'+src+'</div></div></article>';}).join(""):'<div class="empty">当前筛选条件下暂无未来行程。</div>';}
$("filters").addEventListener("click",e=>{if(e.target.tagName!=="BUTTON")return;filter=e.target.dataset.filter;[...$("filters").querySelectorAll("button")].forEach(b=>b.classList.toggle("active",b===e.target));render();});
fetch("./data.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("data.json 加载失败");return r.json();}).then(d=>{allEvents=d.events||[];$("updated").textContent="最近更新："+(d.updated_label||d.updated||"未知");$("changes").textContent=(d.changes||[]).length;$("pending").textContent="见核验报告";const changes=d.changes||[];$("changeList").innerHTML=changes.length?changes.map(x=>'<div>• '+esc(x.text||x.id||"行程更新")+'</div>').join(""):"本轮未发现新增或变更。";render();}).catch(e=>{$("updated").textContent=e.message;$("events").innerHTML='<div class="empty">暂时无法读取行程数据，请稍后刷新。</div>';});
</script></body></html>
