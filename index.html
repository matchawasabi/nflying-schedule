<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N.Flying 行程日历</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root {
  /* 方向：演出海报式的「舞台夜色」。暖黑底 + 舞台红光 + 奶油色文字；窄体海报字做标题，等宽字做时间。
     布局：顶部字标与摘要 → 单月日历可前后切换（右侧当日详情）→ 未来两周清单 */
  --bg: #0f0d11;
  --bg-2: #18151b;
  --cell: #1d1a21;
  --paper: #f2ece2;
  --muted: #9d95a3;
  --line: rgba(242, 236, 226, .11);
  --red: #ea3a2f;
  --red-deep: #7d1915;
  /* 中文统一用同一套黑体；英文标题和数字用窄体海报字，时间用等宽字，里面出现的中文也落到同一套黑体 */
  --font-cjk: "Noto Sans SC", "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-display: "Big Shoulders Display", var(--font-cjk);
  --font-body: var(--font-cjk);
  --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, var(--font-cjk);

  --c-concert: #ea3a2f;
  --c-joint: #f2913f;
  --c-sign_online: #4fc7b3;
  --c-sign_offline: #a3d468;
  --c-broadcast: #7298ff;
  --c-music_show: #b892ff;
  --c-release: #ff74b0;
  --c-ticket: #f3c54f;
  --c-musical: #e9a6ff;
  --c-other: #8e8896;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background:
    radial-gradient(900px 520px at 88% -8%, rgba(234, 58, 47, .30), transparent 65%),
    radial-gradient(700px 420px at -10% 12%, rgba(125, 25, 21, .35), transparent 70%),
    var(--bg);
  color: var(--paper);
  font-family: var(--font-body); font-size: 14px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  min-height: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .07;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.share body { position: relative; }
.share body::before { position: absolute; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
a { color: inherit; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.zh { font-family: var(--font-body); letter-spacing: 0; text-transform: none; font-weight: 500; }

.wrap { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 28px 24px 56px; display: grid; gap: 22px; }

/* ── 字标 ── */
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.mark { display: grid; gap: 4px; }
.mark .kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: .28em; color: var(--muted); text-transform: uppercase; }
.mark h1 {
  margin: 0; font-family: var(--font-display); font-weight: 900; text-transform: uppercase;
  font-size: clamp(52px, 9vw, 104px); line-height: .82; letter-spacing: .01em;
}
.mark h1 .logo { display: block; height: clamp(54px, 8vw, 92px); width: auto; max-width: 100%; overflow: visible; margin: 6px 0 8px; filter: drop-shadow(0 0 22px rgba(234,58,47,.28)); }
.mark .sub { display: flex; gap: 12px; align-items: baseline; font-size: 15px; font-weight: 700; }
.mark .sub span { color: var(--muted); font-weight: 400; font-size: 13px; }
.meta { display: grid; justify-items: end; gap: 10px; }
.updated { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.updated b { color: var(--paper); font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: rgba(255,255,255,.03); }
.seg button { border: 0; background: transparent; padding: 5px 13px; border-radius: 999px; cursor: pointer; font-size: 12.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--bg); font-weight: 700; }

/* ── 摘要 ── */
.summary { display: grid; grid-template-columns: 1.35fr 1fr 1fr; gap: 14px; }
.card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px; }
.tile { padding: 18px 20px; display: grid; gap: 8px; align-content: start; }
.label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.tile.next {
  background:
    radial-gradient(420px 220px at 0% 0%, rgba(234,58,47,.20), transparent 70%),
    var(--bg-2);
  border-color: rgba(234,58,47,.38); position: relative; overflow: hidden;
  box-shadow: inset 3px 0 0 var(--red);
}
.tile.next .label { color: var(--red); }
.tile.next .big { display: flex; align-items: baseline; gap: 10px; }
.tile.next .big b { font-family: var(--font-display); font-weight: 900; font-size: 54px; line-height: .85; color: var(--red); letter-spacing: .01em; }
.tile.next .big span { font-weight: 700; font-size: 14px; color: var(--paper); }
.tile.next .t { font-weight: 700; font-size: 16px; line-height: 1.4; }
.tile.next .s { font-size: 12.5px; color: var(--muted); }
.tile .t { font-weight: 700; line-height: 1.4; }
.tile .s { font-size: 12.5px; color: var(--muted); }
.tile .s.row { display: flex; flex-wrap: wrap; column-gap: 14px; row-gap: 2px; }
.label .zh { margin-left: .9em; }
.tile.next .t .tag.member { vertical-align: 2px; margin-right: 4px; }
.tix-item { display: grid; gap: 2px; padding-top: 8px; border-top: 1px dashed var(--line); }
.tix-item:first-of-type { border-top: 0; padding-top: 0; }
.update-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: 13px; }
.update-list .k { font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-right: 6px; }
.k-new { background: rgba(163, 212, 104, .16); color: var(--c-sign_offline); }
.k-changed { background: rgba(243, 197, 79, .16); color: var(--c-ticket); }
.k-cancelled { background: rgba(234, 58, 47, .18); color: var(--red); }

/* ── 筛选 ── */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters .hint { font-family: var(--font-mono); font-size: 11px; letter-spacing: .2em; color: var(--muted); margin-right: 4px; text-transform: uppercase; }
.chip {
  --c: var(--c-other);
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  padding: 6px 12px 6px 10px; border-radius: 999px; font-size: 12.5px;
  border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  background: color-mix(in srgb, var(--c) 14%, transparent);
}
.chip .sw { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.chip .n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.chip[aria-pressed="false"] { background: transparent; opacity: .45; }
.chip[aria-pressed="false"] .sw { background: transparent; border: 1.5px solid var(--c); }
.chip.member { --c: var(--paper); }

/* ── 主体 ── */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.months { display: grid; gap: 18px; }
.cal { padding: 18px; }
.cal-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.cal-head h2 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 44px; line-height: .9; text-transform: uppercase; letter-spacing: .02em; }
.cal-head .ym { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.cal-head .cnt { margin-left: auto; font-size: 12px; color: var(--muted); }
.cal-head .cnt b { color: var(--paper); font-family: var(--font-mono); }
.cal-head { flex-wrap: wrap; }
.nav { display: inline-flex; gap: 6px; }
.nav button { border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--paper); border-radius: 10px; min-width: 36px; height: 32px; padding: 0 10px; cursor: pointer; font-size: 13px; }
.nav button:hover:not(:disabled) { border-color: rgba(242,236,226,.45); }
.nav button:disabled { opacity: .3; cursor: default; }
.share .nav { display: none; }

.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.dow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; color: var(--muted); padding: 0 6px 4px; }
.dow.we { color: var(--red); }
.day {
  min-height: 108px; border: 1px solid var(--line); border-radius: 10px; padding: 6px;
  background: var(--cell); display: flex; flex-direction: column; gap: 4px;
  cursor: pointer; text-align: left; position: relative; min-width: 0;
}
.day:hover { border-color: rgba(242,236,226,.35); }
.day.out { background: transparent; border-color: transparent; cursor: default; }
.day.out .dn { opacity: .25; }
.day.past:not(.out) { opacity: .45; }
.day.show .dn .n { color: var(--red); }
.day.show.today .dn .n { background: var(--red); color: #fff; }
.day.stage { border-color: rgba(234,58,47,.45); background: linear-gradient(180deg, rgba(234,58,47,.10), var(--cell) 55%); box-shadow: inset 0 2px 0 var(--red); }
.day .dn { display: flex; align-items: center; justify-content: space-between; }
.day .dn .n { font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; }
.day.today .dn .n { background: var(--paper); color: var(--bg); }
.day.sel { outline: 2px solid var(--paper); outline-offset: -1px; }
.day .dots { display: none; gap: 3px; flex-wrap: wrap; }
.day .dots i { width: 7px; height: 7px; border-radius: 2px; background: var(--c); }
.pill {
  --c: var(--c-other);
  display: grid; gap: 1px; font-size: 11.5px; line-height: 1.3; padding: 4px 6px 4px 7px; border-radius: 6px;
  background: color-mix(in srgb, var(--c) 16%, transparent);
  border-left: 3px solid var(--c); min-width: 0;
}
.pill.solid { background: linear-gradient(100deg, rgba(234,58,47,.42), rgba(234,58,47,.16)); border: 1px solid rgba(234,58,47,.8); border-left: 3px solid var(--red); color: #fff; box-shadow: 0 0 14px rgba(234,58,47,.22); }
.pill.solid .tx { font-weight: 700; }
.pill.solid .tm { color: #fff; }
.pill.solid .tm { display: flex; align-items: center; gap: 5px; }
.pill .live { font-family: var(--font-mono); font-size: 8.5px; font-weight: 700; letter-spacing: .14em; color: #fff; background: var(--red); border-radius: 3px; padding: 0 4px; line-height: 1.5; }
.pill .tx .loc { display: block; color: var(--muted); font-weight: 400; font-size: 10.5px; }
.pill .tm { font-family: var(--font-mono); font-weight: 700; font-size: 10.5px; color: var(--c); }
.pill .tx { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; font-weight: 500; }
.pill .mb { font-weight: 700; margin-right: 3px; }
.pill.tbc { border-left-style: dashed; }
.more { font-size: 11px; color: var(--muted); padding-left: 4px; }
.badge-new { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--c-sign_offline); box-shadow: 0 0 0 3px rgba(163,212,104,.2); }

/* ── 侧栏：当日详情 ── */
.side { position: sticky; top: 16px; display: grid; gap: 14px; }
.panel { padding: 18px; }
.panel h3 { margin: 0 0 12px; display: flex; align-items: baseline; gap: 10px; }
.panel h3 .big { font-family: var(--font-display); font-weight: 900; font-size: 34px; line-height: .9; }
.panel h3 .sub { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.ev-list { display: grid; gap: 12px; }
.ev { --c: var(--c-other); display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.ev:first-child { border-top: 0; padding-top: 0; }
.ev .when { border-right: 3px solid var(--c); padding-right: 10px; text-align: right; }
.ev .when .tm { font-family: var(--font-mono); font-weight: 700; font-size: 17px; line-height: 1.2; }
.ev .when .tz { font-size: 11px; color: var(--muted); }
.ev .body { display: grid; gap: 4px; min-width: 0; }
.ev .row1 { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { --c: var(--c-other); font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 4px; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); white-space: nowrap; }
.tag.tbc { color: var(--muted); background: transparent; border: 1px dashed var(--muted); }
.tag.member { color: var(--bg); background: var(--paper); }
.tag.new { --c: var(--c-sign_offline); }
.tag.changed { --c: var(--c-ticket); }
.ev .title { font-weight: 700; overflow-wrap: anywhere; }
.ev .info { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.ev .info b { color: var(--paper); font-weight: 500; }
.ev .src { font-size: 12px; display: flex; flex-wrap: wrap; gap: 10px; }
.ev .src a { color: var(--muted); text-decoration-color: var(--line); text-underline-offset: 3px; }
.ev .src a:hover { color: var(--red); }
.empty { color: var(--muted); font-size: 13px; padding: 4px 0; }

/* ── 未来两周 ── */
.fort { padding: 20px 22px; }
.fort-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.fort-head h2 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 30px; text-transform: uppercase; letter-spacing: .02em; }
.fort-head span { font-size: 12.5px; color: var(--muted); }
.sl-day { display: grid; grid-template-columns: 86px 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.sl-day:first-of-type { border-top: 0; }
.sl-date .n { font-family: var(--font-display); font-weight: 900; font-size: 28px; line-height: .9; display: block; }
.sl-date small { font-family: var(--font-mono); color: var(--muted); font-size: 11px; letter-spacing: .1em; }
.sl-items { display: grid; gap: 7px; }
.sl-item { --c: var(--c-other); display: grid; grid-template-columns: 52px auto 1fr; gap: 12px; align-items: center; font-size: 14px; cursor: pointer; }
.sl-tm { font-family: var(--font-mono); font-weight: 700; color: var(--c); font-size: 13px; }
.sl-tt { font-weight: 500; min-width: 0; }
.sl-v { color: var(--muted); font-weight: 400; margin-left: 12px; }
.sl-date small.td { display: inline-block; margin-left: 6px; color: var(--red); font-weight: 700; }

footer { display: none; font-size: 12px; color: var(--muted); padding-top: 10px; border-top: 1px solid var(--line); }
.share footer { display: block; }
footer .share-only { color: var(--paper); font-weight: 700; }
.share-only { display: none; }
.err { padding: 18px; color: var(--red); }

/* ── 截图版式（#share） ── */
.share .share-only { display: block; }
.share .wrap { max-width: 1080px; padding: 44px 40px 40px; }
.share .seg, .share .filters, .share .side { display: none; }
.share .main { grid-template-columns: 1fr; }
.share .summary { grid-template-columns: 1.35fr 1fr 1fr; }
.share .summary .tile.next { grid-column: auto; }
.share .day { cursor: default; min-height: 112px; }
.share .day .pill { display: grid; } .share .day .more { display: block; } .share .day .dots { display: none; }
.share .day.past:not(.out) { opacity: .4; }

@media (max-width: 1020px) {
  .main { grid-template-columns: 1fr; }
  .side { position: static; }
  .summary { grid-template-columns: 1fr 1fr; }
  .summary .tile.next { grid-column: 1 / -1; }
}
@media (max-width: 640px) {
  .wrap { padding: 20px 16px 40px; gap: 18px; }
  .meta { justify-items: start; }
  .summary { grid-template-columns: 1fr; }
  .grid { gap: 3px; }
  .cal { padding: 12px; }
  .cal-head h2 { font-size: 36px; }
  .day { min-height: 54px; padding: 4px; border-radius: 8px; }
  .day .pill, .day .more { display: none; }
  .day .dots { display: flex; }
  .day .dn .n { font-size: 15px; width: 22px; height: 22px; }
  .dow { padding: 0 2px 4px; text-align: center; letter-spacing: 0; }
  .sl-day { grid-template-columns: 62px 1fr; }
  .sl-item { grid-template-columns: 46px 1fr; }
  .sl-item .tag { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .day, .chip { transition: border-color .15s, background-color .15s, opacity .15s; }
}

.gpt-data-tools {display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin:10px 0 14px;color:var(--muted,#aaa);font-size:12px}
.gpt-data-tools button {font:inherit;color:#eee;background:#242424;border:1px solid #565656;border-radius:5px;padding:6px 10px;cursor:pointer}
.gpt-data-tools button:hover {border-color:#ea3a2f;color:#fff}
.gpt-data-tools #gpt-status {max-width:100%;overflow-wrap:anywhere}
.share .gpt-data-tools {display:none}
</style>
</head>

<script>
const CATS = {
  concert:      { name: "单独演唱会" },
  joint:        { name: "联合公演 / 音乐节" },
  sign_online:  { name: "线上签售" },
  sign_offline: { name: "线下签售" },
  broadcast:    { name: "电视 / 广播" },
  music_show:   { name: "打歌舞台" },
  musical:      { name: "音乐剧 / 舞台剧" },
  release:      { name: "发行" },
  ticket:       { name: "票务" },
  other:        { name: "其他" }
};
const STAGE = new Set(["concert", "joint"]);
const MEMBERS = ["李承协", "车勋", "金宰铉", "柳会胜", "徐东成"];
const WD = ["日","一","二","三","四","五","六"];
const MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const state = { ym: null, data: null, useBJ: true, off: new Set(), offM: new Set(), sel: null, today: null, changeMap: {}, share: false };

function todayBJ() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
}
function parse(d) { const [y,m,dd] = d.split("-").map(Number); return new Date(Date.UTC(y, m-1, dd)); }
function fmt(dt) { return dt.toISOString().slice(0,10); }
function addDays(d, n) { const x = parse(d); x.setUTCDate(x.getUTCDate()+n); return fmt(x); }
function diffDays(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); }
function wd(d) { return WD[parse(d).getUTCDay()]; }
function md(d) { return d.slice(5).replace("-", "."); }
function zh(html) { return String(html).replace(/([\u3000-\u303f\u3400-\u9fff\uff00-\uffef]+)/g, '<span class="zh">$1</span>'); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function catOf(e) { return CATS[e.cat] ? e.cat : "other"; }
function membersOf(e) { return !e.member ? [] : Array.isArray(e.member) ? e.member : [e.member]; }
function tzLabel(e) {
  const m = { KST: "韩国", JST: "日本", "北京": "北京" };
  if (m[e.tz]) return m[e.tz];
  if (e.tz === "当地") return e.city ? e.city : "当地";
  return e.tz || "";
}
function timeOf(e) {
  if (state.useBJ) return { t: e.bj || "待定", z: e.bj ? "北京" : "" };
  return { t: e.time || "待定", z: e.time ? tzLabel(e) : "" };
}
function visible(e) {
  if (state.off.has(catOf(e))) return false;
  const ms = membersOf(e);
  if (!ms.length) return !state.offM.has("全员");
  return ms.some(m => !state.offM.has(m));
}
function sorted(list) { return list.slice().sort((a,b) => (a.date+(a.bj||"99")).localeCompare(b.date+(b.bj||"99"))); }
function eventsOn(d) { return sorted(state.data.events.filter(e => e.date === d && visible(e))); }
function live(e) { return e.status !== "cancelled"; }
function mbPrefix(e) { const ms = membersOf(e); return ms.length ? `<span class="mb">${esc(ms.join("、"))}</span>` : ""; }

function renderTop() {
  const D = state.data;
  document.getElementById("updated").innerHTML = zh(`UPDATED <b>${esc(String(D.updated_label || D.updated).replace(/\s*[（(][上下]午场[）)]/, ""))}</b>`);

  const nx = sorted(D.events.filter(e => e.date >= state.today && e.cat !== "ticket" && live(e)))[0];
  const tn = document.getElementById("tile-next");
  if (nx) {
    const n = diffDays(state.today, nx.date), tm = timeOf(nx), ms = membersOf(nx);
    tn.innerHTML = `<div class="label">Next up<span class="zh">下一项行程</span></div>
      <div class="big">${n === 0 ? "<b>TODAY</b>" : `<b>${n}</b><span>天后</span>`}</div>
      <div class="t">${ms.length ? `<span class="tag member">${esc(ms.join("、"))}</span> ` : ""}${esc(nx.title)}</div>
      <div class="s row"><span><span class="mono">${md(nx.date)}</span> 周${wd(nx.date)}</span><span>${esc(tm.t)} ${esc(tm.z)}</span>${nx.venue ? `<span>${esc(nx.venue)}</span>` : ""}</div>`;
  } else tn.innerHTML = `<div class="label">Next up</div><div class="t">暂无已公布的行程</div>`;

  const tix = sorted(D.events.filter(e => e.cat === "ticket" && live(e) && e.date >= state.today && diffDays(state.today, e.date) <= 7));
  document.getElementById("tile-ticket").innerHTML = `<div class="label">Tickets<span class="zh">7 天内票务</span></div>` + (tix.length ? tix.map(e => {
    const tm = timeOf(e);
    return `<div class="tix-item"><div class="t">${esc(e.title)}</div>
      <div class="s row"><span><span class="mono">${md(e.date)}</span> ${esc(tm.t)} ${esc(tm.z)}</span>${e.venue ? `<span>${esc(e.venue)}</span>` : ""}</div></div>`;
  }).join("") : `<div class="s">7 天内没有开售或抽选</div>`);

  const ch = D.changes || [];
  const K = { new: "NEW", changed: "CHG", cancelled: "OFF" };
  document.getElementById("tile-update").innerHTML = `<div class="label">Changes<span class="zh">本次更新</span></div>` + (ch.length
    ? `<ul class="update-list">${ch.slice(0,5).map(c => `<li><span class="k k-${esc(c.kind)}">${K[c.kind] || esc(c.kind)}</span>${esc(c.text)}</li>`).join("")}${ch.length > 5 ? `<li class="s">另有 ${ch.length-5} 项</li>` : ""}</ul>`
    : `<div class="t">与上次相比没有变化</div><div class="s">${esc(D.changes_note || "")}</div>`);
}

function renderFilters() {
  const counts = {}, mcount = {};
  state.data.events.forEach(e => {
    const c = catOf(e); counts[c] = (counts[c] || 0) + 1;
    membersOf(e).forEach(m => mcount[m] = (mcount[m] || 0) + 1);
  });
  const el = document.getElementById("filters");
  let html = `<span class="hint">Type</span>` + Object.keys(CATS).filter(k => counts[k]).map(k =>
    `<button type="button" class="chip" style="--c:var(--c-${k})" data-cat="${k}" aria-pressed="${!state.off.has(k)}"><span class="sw"></span>${CATS[k].name}<span class="n">${counts[k]}</span></button>`).join("");
  const ms = MEMBERS.filter(m => mcount[m]);
  if (ms.length) {
    html += `<span class="hint" style="margin-left:10px">Member</span>` + ["全员"].concat(ms).map(m =>
      `<button type="button" class="chip member" data-m="${m}" aria-pressed="${!state.offM.has(m)}"><span class="sw"></span>${m === "全员" ? "全员行程" : m}${mcount[m] ? `<span class="n">${mcount[m]}</span>` : ""}</button>`).join("");
  }
  el.innerHTML = html;
  el.querySelectorAll(".chip[data-cat]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.cat; state.off.has(k) ? state.off.delete(k) : state.off.add(k); rerender();
  }));
  el.querySelectorAll(".chip[data-m]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.m; state.offM.has(k) ? state.offM.delete(k) : state.offM.add(k); rerender();
  }));
}

function monthHTML(ym) {
  const [y, m] = ym.split("-").map(Number);
  const first = `${ym}-01`;
  const lead = (parse(first).getUTCDay() + 6) % 7;
  const start = addDays(first, -lead);
  const dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const cells = Math.ceil((lead + dim) / 7) * 7;
  const maxP = state.share ? 4 : 3;
  let html = "", count = 0;
  for (let i = 0; i < cells; i++) {
    const d = addDays(start, i);
    const out = d.slice(0,7) !== ym;
    const evs = out ? [] : eventsOn(d);
    if (!out && d >= state.today) count += evs.filter(live).length;
    const stage = evs.some(e => catOf(e) === "concert" && live(e));
    const show = evs.some(e => (catOf(e) === "concert" || catOf(e) === "joint") && live(e));
    const cls = ["day", out && "out", d < state.today && "past", d === state.today && "today", show && "show", stage && "stage", d === state.sel && !state.share && "sel"].filter(Boolean).join(" ");
    const hasNew = evs.some(e => state.changeMap[e.id]);
    html += `<button type="button" class="${cls}" data-d="${d}" ${out ? 'tabindex="-1" aria-hidden="true"' : `aria-label="${md(d)} ${evs.length} 项行程"`}>
      <div class="dn"><span class="n">${out ? "" : Number(d.slice(8))}</span></div>
      ${hasNew ? '<span class="badge-new" title="本次有更新"></span>' : ""}
      ${evs.slice(0, maxP).map(e => { const tm = timeOf(e), c = catOf(e);
        return `<div class="pill${STAGE.has(c) && c === "concert" ? " solid" : ""}${e.status === "tbc" ? " tbc" : ""}" style="--c:var(--c-${c})" title="${esc(e.title)}"><span class="tm">${esc(tm.t)}${c === "concert" ? '<span class="live">LIVE</span>' : ""}</span><span class="tx">${mbPrefix(e)}${esc(e.short || e.title)}</span></div>`; }).join("")}
      ${evs.length > maxP ? `<div class="more">还有 ${evs.length-maxP} 项</div>` : ""}
      <div class="dots">${evs.map(e => `<i style="--c:var(--c-${catOf(e)})"></i>`).join("")}</div>
    </button>`;
  }
  return { html, count };
}
function navRange() {
  const ds = state.data.events.filter(live).map(e => e.date).concat([state.today]).sort();
  return [ds[0].slice(0,7), ds[ds.length-1].slice(0,7)];
}
function shiftMonth(k) {
  const [y, m] = state.ym.split("-").map(Number);
  state.ym = fmt(new Date(Date.UTC(y, m-1+k, 1))).slice(0,7);
  renderMonths();
}
function renderMonths() {
  const dow = ["MON","TUE","WED","THU","FRI","SAT","SUN"].map((d,i) => `<div class="dow${i>=5?" we":""}">${d}</div>`).join("");
  const el = document.getElementById("months");
  const ym = state.ym, [y, m] = ym.split("-").map(Number);
  const [minYm, maxYm] = navRange();
  const { html, count } = monthHTML(ym);
  const later = state.data.events.filter(e => live(e) && e.date.slice(0,7) > ym).length;
  el.innerHTML = `<section class="card cal" id="m-${ym}"><div class="cal-head"><h2>${MON[m-1]}</h2><span class="ym">${y}<span class="zh"> 年 </span>${m}<span class="zh"> 月</span></span>
      <span class="cnt">本月待进行 <b>${count}</b> 项${later ? `，之后还有 <b>${later}</b> 项` : ""}</span>
      <span class="nav"><button type="button" id="prev" aria-label="上个月" ${ym <= minYm ? "disabled" : ""}>‹</button><button type="button" id="this-m">本月</button><button type="button" id="next" aria-label="下个月" ${ym >= maxYm ? "disabled" : ""}>›</button></span></div>
    <div class="grid">${dow}</div><div class="grid" style="margin-top:4px">${html}</div></section>`;
  el.querySelectorAll(".day:not(.out)").forEach(b => b.addEventListener("click", () => selectDay(b.dataset.d)));
  document.getElementById("prev").addEventListener("click", () => shiftMonth(-1));
  document.getElementById("next").addEventListener("click", () => shiftMonth(1));
  document.getElementById("this-m").addEventListener("click", () => { state.ym = state.today.slice(0,7); selectDay(state.today); });
}

function evCard(e) {
  const tm = timeOf(e), c = catOf(e), chg = state.changeMap[e.id];
  const other = state.useBJ ? (e.time && e.tz !== "北京" ? `当地时间 ${e.time}（${tzLabel(e)}）` : "") : (e.bj && e.tz !== "北京" ? `北京时间 ${e.bj}` : "");
  return `<div class="ev" style="--c:var(--c-${c})">
    <div class="when"><div class="tm">${esc(tm.t)}</div><div class="tz">${esc(tm.z)}</div></div>
    <div class="body">
      <div class="row1">${membersOf(e).map(m => `<span class="tag member">${esc(m)}</span>`).join("")}<span class="tag" style="--c:var(--c-${c})">${CATS[c].name}</span>
        ${e.status === "tbc" ? '<span class="tag tbc">待确认</span>' : ""}
        ${chg ? `<span class="tag ${chg === "new" ? "new" : "changed"}">${chg === "new" ? "新增" : "变更"}</span>` : ""}</div>
      <div class="title">${esc(e.title)}</div>
      ${e.venue ? `<div class="info">地点 <b>${esc(e.venue)}</b></div>` : ""}
      ${e.ticket ? `<div class="info">票务 <b>${esc(e.ticket)}</b></div>` : ""}
      ${other ? `<div class="info">${esc(other)}</div>` : ""}
      ${e.note ? `<div class="info">${esc(e.note)}</div>` : ""}
      ${(e.sources||[]).length ? `<div class="src">${e.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a>`).join("")}</div>` : ""}
    </div></div>`;
}
function renderDay() {
  const d = state.sel, n = diffDays(state.today, d);
  const rel = n === 0 ? "今天" : n === 1 ? "明天" : n > 0 ? `${n} 天后` : `${-n} 天前`;
  document.getElementById("day-title").innerHTML = `<span class="big">${Number(d.slice(5,7))}.${Number(d.slice(8))}</span><span class="sub">周${wd(d)}</span><span class="sub">${rel}</span>`;
  const evs = eventsOn(d);
  document.getElementById("day-list").innerHTML = evs.length ? evs.map(evCard).join("") : `<div class="empty">这一天没有已公布的行程。点日历上的日期查看详情。</div>`;
}
function renderFortnight() {
  const end = addDays(state.today, 13);
  const list = sorted(state.data.events.filter(e => e.date >= state.today && e.date <= end && live(e) && visible(e)));
  const by = {};
  list.forEach(e => (by[e.date] = by[e.date] || []).push(e));
  const el = document.getElementById("fortnight");
  el.innerHTML = Object.keys(by).length ? Object.keys(by).map(d => `<div class="sl-day">
    <div class="sl-date"><span class="n">${md(d)}</span><small><span class="zh">周${wd(d)}</span></small>${d === state.today ? '<small class="td">TODAY</small>' : ""}</div>
    <div class="sl-items">${by[d].map(e => { const c = catOf(e); return `<div class="sl-item" style="--c:var(--c-${c})" data-d="${d}">
      <span class="sl-tm">${esc(e.bj || "待定")}</span><span class="tag" style="--c:var(--c-${c})">${CATS[c].name}</span>
      <span class="sl-tt">${membersOf(e).map(m => `<span class="tag member">${esc(m)}</span> `).join("")}${esc(e.title)}${e.venue && e.venue !== "线上" ? `<span class="sl-v">${esc(e.venue)}</span>` : ""}${e.status === "tbc" ? ' <span class="tag tbc">待确认</span>' : ""}</span></div>`; }).join("")}</div></div>`).join("")
    : `<div class="empty">未来两周没有已公布的行程。</div>`;
  el.querySelectorAll(".sl-item").forEach(b => b.addEventListener("click", () => selectDay(b.dataset.d, true)));
}
function renderFoot() {
  const D = state.data;
  document.getElementById("foot").innerHTML = `<div class="share-only">N.Flying 行程追踪 | GPT 版日历</div>`;
}
function selectDay(d, scroll) {
  state.sel = d; state.ym = d.slice(0,7); renderMonths(); renderDay();
  if (scroll && !state.share) {
    const target = window.innerWidth > 1020 ? document.getElementById("months") : document.querySelector(".side");
    target.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}
function rerender() { renderFilters(); renderMonths(); renderDay(); renderFortnight(); }
function setTZ(bj) {
  state.useBJ = bj;
  document.getElementById("tz-bj").setAttribute("aria-pressed", bj);
  document.getElementById("tz-off").setAttribute("aria-pressed", !bj);
  renderTop(); renderMonths(); renderDay();
}


const GPT_KEY = "nflying-gpt-calendar-v1";
function validateGPTData(d) {
  if (!d || typeof d !== "object" || !Array.isArray(d.events) || !Number.isFinite(Date.parse(d.updated))) throw new Error("不是完整的行程 JSON");
  const ids = new Set();
  for (const e of d.events) {
    if (!e || typeof e.id !== "string" || ids.has(e.id) || !/^\d{4}-\d{2}-\d{2}$/.test(e.date) || typeof e.title !== "string" || !Object.prototype.hasOwnProperty.call(CATS,e.cat) || !Array.isArray(e.sources) || !e.sources.length) throw new Error("行程字段不完整、ID 重复或缺少来源");
    if (!e.sources.every(s => s && typeof s.label === "string" && typeof s.url === "string" && /^https?:\/\//i.test(s.url))) throw new Error("来源链接格式不正确");
    ids.add(e.id);
  }
  if (d.changes && !Array.isArray(d.changes)) throw new Error("changes 格式错误");
  return d;
}
function gptStatus(msg){document.getElementById("gpt-status").textContent=msg;}
function applyGPTData(d) {
  state.data=validateGPTData(d);
  state.changeMap={};
  (d.changes||[]).forEach(c=>{if(c&&c.id)state.changeMap[c.id]=c.kind;});
  renderTop(); rerender(); renderFoot();
}
function bindGPTTools() {
  document.getElementById("gpt-import").addEventListener("click",()=>document.getElementById("gpt-file").click());
  document.getElementById("gpt-file").addEventListener("change",async ev=>{
    try {
      const f=ev.target.files[0]; if(!f)return;
      const d=validateGPTData(JSON.parse(await f.text()));
      if(Date.parse(d.updated)<Date.parse(state.data.updated) && !confirm("这份数据比当前数据旧，仍要导入吗？"))return;
      applyGPTData(d);
      try {localStorage.setItem(GPT_KEY,JSON.stringify(d));gptStatus(`已导入 ${d.events.length} 条行程，并保存到当前浏览器。`);}
      catch (_) {gptStatus(`已导入 ${d.events.length} 条行程；当前浏览器无法保存，刷新后需重新导入。`);}
    } catch(err){gptStatus("导入失败："+err.message);}
    finally {ev.target.value="";}
  });
  document.getElementById("gpt-export").addEventListener("click",()=>{
    const url=URL.createObjectURL(new Blob([JSON.stringify(state.data,null,2)],{type:"application/json"}));
    const a=document.createElement("a");a.href=url;a.download="nflying-data.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
}

async function init() {
  try {
    const inline = document.getElementById("nf-data").textContent.trim();
    if (inline && !inline.startsWith("/*")) {
      state.data = JSON.parse(inline);
    } else {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 10000);
      const r = await fetch("data.json", { cache: "no-store", signal: ctl.signal });
      clearTimeout(timer);
      if (!r.ok) throw new Error(r.status);
      state.data = await r.json();
    }
  } catch (err) {
    document.querySelector(".wrap").insertAdjacentHTML("beforeend", `<div class="card err">行程数据没有载入（${esc(err.message)}）。请刷新页面重试。</div>`);
    return;
  }
  try {
    const saved=localStorage.getItem(GPT_KEY);
    if(saved){const d=validateGPTData(JSON.parse(saved)); if(Date.parse(d.updated)>=Date.parse(state.data.updated)){state.data=d;gptStatus(`已载入浏览器保存的 ${d.events.length} 条行程。`);}}
  } catch (_) {}
  state.share = location.hash === "#share";
  if (state.share) document.documentElement.classList.add("share");
  state.today = todayBJ();
  state.sel = state.today;
  state.ym = state.today.slice(0,7);
  (state.data.changes || []).forEach(c => { if (c.id) state.changeMap[c.id] = c.kind; });
  document.getElementById("tz-bj").addEventListener("click", () => setTZ(true));
  document.getElementById("tz-off").addEventListener("click", () => setTZ(false));
  renderTop(); renderFilters(); renderMonths(); renderDay(); renderFortnight(); renderFoot();
  bindGPTTools();
  document.documentElement.setAttribute("data-ready", "1");
}
init();
</script>
</body>
</html>
