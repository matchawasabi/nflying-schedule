name: Publish N.Flying calendar
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static calendar
        run: |
          mkdir -p public
          cp index.html data.json public/
          touch public/.nojekyll
          python -m json.tool public/data.json >/dev/null
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy calendar
        id: deployment
        uses: actions/deploy-pages@v4
