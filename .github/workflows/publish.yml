name: Publish N.Flying calendar
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static calendar
        run: |
          mkdir -p public
          cp index.html data.json public/
          touch public/.nojekyll
          python -m json.tool public/data.json >/dev/null
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5 6; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="github-pages" and .expired==false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 5
          done
          echo "Pages artifact not visible yet" >&2
          exit 1
      - name: Deploy calendar
        id: deployment
        uses: actions/deploy-pages@v4
